<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone - StudyCord</title>
    <style>
        :root {
            --bg-servers: #202225;
            --bg-channels: #2f3136;
            --bg-chat: #36393f;
            --bg-input: #40444b;
            --text-normal: #dcddde;
            --text-muted: #8e9297;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --success: #3ba55d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-chat); color: var(--text-normal); height: 100vh; display: flex; overflow: hidden; }

        #auth-container { position: fixed; inset: 0; background: #2f3136; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #36393f; padding: 32px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 16px; }
        .auth-card h2 { color: #fff; text-align: center; }
        .auth-card input { background: #18191c; border: none; padding: 12px; border-radius: 4px; color: #fff; outline: none; }
        .auth-card button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .auth-card button:hover { background: var(--accent-hover); }

        #app-container { display: none; width: 100%; height: 100%; display: flex; }
        
        .server-rail { width: 72px; background-color: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; border-radius: 50%; background: #36393f; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
        .server-icon.active { border-radius: 16px; background: var(--accent); }

        .channels-sidebar { width: 240px; background-color: var(--bg-channels); display: flex; flex-direction: column; flex-shrink: 0; }
        .server-header-bar { height: 48px; padding: 0 16px; font-weight: 700; border-bottom: 2px solid #202225; display: flex; align-items: center; color: #fff; }
        .channels-list { flex: 1; padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .channel-item { padding: 8px 10px; border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .channel-item:hover { background: rgba(255,255,255,0.04); color: var(--text-normal); }
        .channel-item.active { background: rgba(255,255,255,0.08); color: #fff; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); position: relative; min-width: 0; }
        .chat-topbar { height: 48px; padding: 0 16px; border-bottom: 2px solid #202225; display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: #fff; }
        .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .message-group { display: flex; gap: 16px; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .msg-header { display: flex; gap: 8px; align-items: baseline; }
        .msg-username { font-weight: 600; color: #fff; }
        .msg-timestamp { font-size: 0.75rem; color: var(--text-muted); }
        .msg-text { color: var(--text-normal); font-size: 0.95rem; line-height: 1.4; word-break: break-word; }

        .chat-input-wrap { padding: 0 16px 24px 16px; }
        .chat-input-box { background: var(--bg-input); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; }
        .chat-input-box input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 1rem; }

        .members-rail { width: 240px; background-color: var(--bg-channels); padding: 16px; overflow-y: auto; flex-shrink: 0; }
        .member-category { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .member-row { display: flex; align-items: center; gap: 10px; padding: 6px; }
        .member-avatar-small { width: 32px; height: 32px; border-radius: 50%; background: #7289da; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; color: white; position: relative; }
        .online-badge { width: 10px; height: 10px; background: var(--success); border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-channels); }
        .voice-badge { background: var(--success); color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; display: none; }

        #videoGrid { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 20px; flex: 1; overflow-y: auto; background: #18191c; }
        .video-box { position: relative; background: #2f3136; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center; border: 2px solid #202225; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .server-rail { display: none; }
            .members-rail { display: none; }
            .channels-sidebar { width: 130px; }
        }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <h2 id="auth-title">Welcome back!</h2>
            <p style="color: var(--text-muted); text-align: center; font-size: 0.9rem;">Sign in to continue to StudyCord</p>
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button onclick="handleAuth()">Log In</button>
            <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;" onclick="toggleMode()">
                Need an account? <span style="color: var(--accent);">Sign up</span>
            </div>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <div class="server-rail">
            <div class="server-icon active" title="StudyCord Official">SC</div>
        </div>

        <div class="channels-sidebar">
            <div class="server-header-bar">StudyCord</div>
            <div class="channels-list" id="channelList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-topbar">
                <span id="currentChannelTitle"># general</span>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="screenShareBtn" onclick="toggleScreenShare()" style="display: none; background: #4f545c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">🖥️ Share Screen</button>
                    <span class="voice-badge" id="voiceActiveBadge">🎥 Video Call Active</span>
                </div>
            </div>
            
            <div class="messages-box" id="messagesBox"></div>
            <div id="videoGrid"></div>
            
            <div class="chat-input-wrap" id="chatInputWrap">
                <form class="chat-input-box" id="chatForm">
                    <input type="text" id="messageInput" placeholder="Message #general" autocomplete="off">
                </form>
            </div>
        </div>

        <div class="members-rail">
            <div class="member-category">Online — <span id="memberCount">0</span></div>
            <div id="membersList"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const BACKEND_URL = window.location.origin;
        let socket = null;
        let currentUser = null;
        let currentChannelId = 'c-gen';
        let isSignup = false;

        let localStream = null;
        const peers = {};
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('auth-title').innerText = isSignup ? 'Create an account' : 'Welcome back!';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const endpoint = isSignup ? '/api/signup' : '/api/login';
            const payload = isSignup ? { username: email.split('@')[0], email, password } : { email, password };

            try {
                const res = await fetch(BACKEND_URL + endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('discord_user', JSON.stringify(currentUser));
                    launchApp();
                } else {
                    alert(data.error);
                }
            } catch (e) { alert('Connection failed'); }
        }

        const saved = localStorage.getItem('discord_user');
        if (saved) { currentUser = JSON.parse(saved); launchApp(); }

        function launchApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';

            socket = io(BACKEND_URL);

            socket.on('load_guilds', (guilds) => {
                const cList = document.getElementById('channelList');
                cList.innerHTML = '';
                guilds[0].channels.forEach(ch => {
                    const div = document.createElement('div');
                    div.className = `channel-item ${ch.id === currentChannelId ? 'active' : ''}`;
                    div.innerHTML = ch.type === 'voice' ? `📹 ${ch.name}` : `# ${ch.name}`;
                    div.onclick = () => {
                        currentChannelId = ch.id;
                        const titleEl = document.getElementById('currentChannelTitle');
                        const inputWrap = document.getElementById('chatInputWrap');
                        const voiceBadge = document.getElementById('voiceActiveBadge');
                        const screenBtn = document.getElementById('screenShareBtn');
                        const msgBox = document.getElementById('messagesBox');
                        const videoGrid = document.getElementById('videoGrid');

                        if (ch.type === 'voice') {
                            titleEl.innerText = `📹 ${ch.name}`;
                            inputWrap.style.display = 'none';
                            voiceBadge.style.display = 'block';
                            screenBtn.style.display = 'block';
                            msgBox.style.display = 'none';
                            videoGrid.style.display = 'grid';
                            startVideoCall(ch.id);
                        } else {
                            titleEl.innerText = `# ${ch.name}`;
                            inputWrap.style.display = 'block';
                            voiceBadge.style.display = 'none';
                            screenBtn.style.display = 'none';
                            msgBox.style.display = 'flex';
                            videoGrid.style.display = 'none';
                            document.getElementById('messageInput').placeholder = `Message #${ch.name}`;
                            stopVideoCall();
                            socket.emit('join_channel', { channelId: currentChannelId, username: currentUser.username });
                        }

                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                    };
                    cList.appendChild(div);
                });
            });

            socket.emit('join_channel', { channelId: currentChannelId, username: currentUser.username });

            socket.on('load_history', (messages) => {
                if (currentChannelId === 'c-voice') return;
                const box = document.getElementById('messagesBox');
                box.innerHTML = '';
                messages.forEach(msg => appendMessage(msg));
            });

            socket.on('chat_message', (msg) => {
                if (msg.channelId === currentChannelId) appendMessage(msg);
            });

            socket.on('update_active_users', (users) => {
                document.getElementById('memberCount').innerText = users.length;
                const mList = document.getElementById('membersList');
                mList.innerHTML = '';
                users.forEach(u => {
                    mList.innerHTML += `
                        <div class="member-row">
                            <div class="member-avatar-small">${u[0].toUpperCase()}<div class="online-badge"></div></div>
                            <span style="font-size: 0.9rem; font-weight: 500;">${u}</span>
                        </div>`;
                });
            });

            socket.on('voice_peer_joined', async ({ socketId, username }) => {
                const pc = createPeerConnection(socketId, username);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('voice_signal', { toSocketId: socketId, signal: { type: 'offer', sdp: pc.localDescription } });
            });

            socket.on('voice_signal', async ({ fromSocketId, signal }) => {
                let pc = peers[fromSocketId] || createPeerConnection(fromSocketId, 'Peer');
                if (signal.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('voice_signal', { toSocketId: fromSocketId, signal: { type: 'answer', sdp: pc.localDescription } });
                } else if (signal.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                } else if (signal.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            });

            document.getElementById('chatForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text) return;

                socket.emit('chat_message', {
                    channelId: currentChannelId,
                    username: currentUser.username,
                    text
                });
                input.value = '';
            });
        }

        async function startVideoCall(channelId) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                renderVideoBox('localVideoContainer', currentUser.username + ' (You)', localStream, true);
                socket.emit('voice_join', { channelId, username: currentUser.username });
            } catch (err) {
                alert('Camera and microphone permissions are required for video calls.');
            }
        }

        async function toggleScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                
                Object.values(peers).forEach(pc => {
                    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) sender.replaceTrack(screenTrack);
                });

                renderVideoBox('localVideoContainer', currentUser.username + ' (Screen)', screenStream, true);

                screenTrack.onended = () => {
                    startVideoCall(currentChannelId);
                };
            } catch (err) {
                console.log("Screen sharing cancelled.");
            }
        }

        function stopVideoCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            Object.keys(peers).forEach(id => {
                peers[id].close();
                delete peers[id];
            });
            document.getElementById('videoGrid').innerHTML = '';
        }

        function createPeerConnection(socketId, username) {
            const pc = new RTCPeerConnection(rtcConfig);
            peers[socketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('voice_signal', { toSocketId: socketId, signal: { candidate: event.candidate } });
                }
            };

            pc.ontrack = (event) => {
                let remoteStream = event.streams[0];
                renderVideoBox('remoteVideo_' + socketId, username || 'Peer', remoteStream, false);
            };

            return pc;
        }

        function renderVideoBox(containerId, labelText, stream, isMuted) {
            let grid = document.getElementById('videoGrid');
            let box = document.getElementById(containerId);
            if (!box) {
                box = document.createElement('div');
                box.className = 'video-box';
                box.id = containerId;
                box.innerHTML = `<video autoplay playsinline ${isMuted ? 'muted' : ''}></video><div class="video-label">${labelText}</div>`;
                grid.appendChild(box);
            }
            box.querySelector('video').srcObject = stream;
        }

        function appendMessage(msg) {
            const box = document.getElementById('messagesBox');
            const group = document.createElement('div');
            group.className = 'message-group';
            group.innerHTML = `
                <div class="msg-avatar">${msg.username[0].toUpperCase()}</div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="msg-username">${msg.username}</span>
                        <span class="msg-timestamp">${msg.timestamp}</span>
                    </div>
                    <div class="msg-text">${escapeHtml(msg.text)}</div>
                </div>
            `;
            box.appendChild(group);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
