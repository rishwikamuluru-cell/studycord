<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCord - Elite Workspace</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg-main: #030712;
            --bg-sidebar: #0b0f19;
            --bg-panel: #111827;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        #auth-container { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.2) 0%, transparent 40%), var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(24px); border: 1px solid var(--border); padding: 45px 38px; border-radius: 28px; width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 18px; }
        .auth-box h2 { color: #fff; text-align: center; font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-box p { color: var(--text-muted); font-size: 0.92rem; text-align: center; margin-top: -10px; }
        .auth-box input { background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 15px 18px; border-radius: 14px; color: #fff; outline: none; transition: 0.25s; font-size: 1rem; }
        .auth-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25); }
        .auth-box button { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1.05rem; transition: 0.25s; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); }
        .auth-box button:hover { opacity: 0.95; transform: translateY(-2px); }
        .switch-auth { text-align: center; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
        .switch-auth span { color: #c084fc; font-weight: 600; }
        .forgot-link { text-align: right; font-size: 0.85rem; color: #c084fc; cursor: pointer; margin-top: -6px; }
        .forgot-link:hover { text-decoration: underline; }

        #app-container { display: none; width: 100%; height: 100%; }
        .sidebar { width: 280px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .sidebar-header { padding: 24px 20px; font-size: 1.3rem; font-weight: 900; color: #ffffff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .user-tag { font-size: 0.75rem; color: #e2e8f0; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 20px; font-weight: 600; border: 1px solid var(--border); }
        .toolbar { padding: 14px 20px 0 20px; display: flex; gap: 8px; align-items: center; }
        .tool-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; cursor: pointer; flex: 1; text-align: center; }
        .tool-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tool-btn.active { background: #059669; border-color: #10b981; color: white; }

        .section-header { padding: 20px 20px 8px 20px; font-size: 0.72rem; font-weight: 800; color: #64748b; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1.2px; }
        .add-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #c084fc; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .add-btn:hover { background: var(--primary); color: #fff; }

        .channel-list { padding: 6px 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .channel { padding: 12px 14px; border-radius: 12px; color: var(--text-muted); font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .channel:hover { background-color: rgba(255,255,255,0.04); color: #fff; }
        .channel.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25)); color: #e879f9; border: 1px solid rgba(99, 102, 241, 0.4); font-weight: 600; }

        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); position: relative; }
        .chat-header { padding: 20px 28px; background-color: var(--bg-sidebar); border-bottom: 1px solid var(--border); font-weight: 700; font-size: 1.2rem; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .logout-btn:hover { background: #ef4444; color: white; }

        .messages-box { flex: 1; padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg-row { display: flex; flex-direction: column; width: 100%; }
        .msg-row.me { align-items: flex-end; }
        .msg-row.other { align-items: flex-start; }

        .msg-bubble { padding: 14px 18px; border-radius: 20px; max-width: 65%; word-break: break-word; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .msg-row.me .msg-bubble { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.me .msg-user { display: none; }
        .msg-row.me .msg-time { color: rgba(255,255,255,0.75); text-align: right; }

        .msg-row.other .msg-bubble { background-color: var(--bg-panel); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .msg-row.other .msg-user { font-weight: 700; color: #c084fc; font-size: 0.82rem; margin-bottom: 4px; }
        .msg-row.other .msg-time { color: var(--text-muted); text-align: left; }

        .msg-text { font-size: 0.98rem; line-height: 1.5; }
        .msg-time { font-size: 0.68rem; margin-top: 6px; display: block; font-weight: 500; }
        .msg-bubble img { max-width: 100%; border-radius: 12px; margin-top: 10px; display: block; border: 1px solid rgba(255,255,255,0.15); }
        .msg-bubble a { color: #60a5fa; text-decoration: none; display: inline-block; margin-top: 6px; font-weight: 600; font-size: 0.9rem; }

        .typing-indicator { padding: 6px 28px; font-size: 0.8rem; color: #a855f7; font-style: italic; height: 24px; display: none; align-items: center; background: rgba(139, 92, 246, 0.05); }

        .members-sidebar { width: 220px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .members-header { padding: 20px; font-size: 0.72rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1.2px; border-bottom: 1px solid var(--border); }
        .members-list { padding: 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .member-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; padding: 8px 10px; border-radius: 8px; color: var(--text-main); background: rgba(255,255,255,0.02); }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .input-form { padding: 20px 28px; background-color: var(--bg-sidebar); display: flex; gap: 14px; align-items: center; border-top: 1px solid var(--border); }
        .file-label { background: var(--bg-panel); color: var(--text-muted); width: 48px; height: 48px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: 1px solid var(--border); }
        .file-label:hover { background: var(--primary); color: white; }
        #file-input { display: none; }
        #message-input { flex: 1; background: var(--bg-main); border: 1px solid var(--border); padding: 14px 20px; border-radius: 14px; color: #fff; outline: none; font-size: 0.98rem; }
        #message-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
        .input-form button[type="submit"] { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 0 28px; height: 48px; border-radius: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        .error-msg { color: #f87171; font-size: 0.85rem; text-align: center; }
        .success-msg { color: #34d399; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">StudyCord</h2>
            <p id="auth-subtitle">Secure Live Student Workspace</p>
            
            <div id="form-fields" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="text" id="reg-username" placeholder="Full Name or Username" style="display: none;">
                <input type="email" id="auth-email" placeholder="Email address">
                <input type="password" id="auth-password" placeholder="Password">
                <div class="forgot-link" id="forgot-password-trigger" onclick="showForgotPassword()">Forgot password?</div>
            </div>

            <div class="error-msg" id="auth-error"></div>
            <div class="success-msg" id="auth-success"></div>
            
            <button id="auth-btn" onclick="handleAuth()">Log In</button>
            <div class="switch-auth" onclick="toggleAuthMode()">
                <span id="switch-text">Don't have an account? Sign up</span>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                StudyCord
                <span class="user-tag" id="current-username-display"></span>
            </div>
            
            <div class="toolbar">
                <button class="tool-btn" id="notifBtn" onclick="toggleNotifications()">🔔 Alerts</button>
                <button class="tool-btn" onclick="cycleTheme()">🎨 Theme</button>
            </div>

            <div class="section-header">
                <span>Channels</span>
                <button class="add-btn" onclick="createNewChannel()" title="New Channel">+</button>
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <span id="current-channel-title"># general-lounge</span>
                <button class="logout-btn" onclick="logout()">Log Out</button>
            </div>
            
            <div class="messages-box" id="messagesBox"></div>
            <div class="typing-indicator" id="typingIndicator"></div>

            <form class="input-form" id="chatForm">
                <label for="file-input" class="file-label" title="Attach File/Image">📎</label>
                <input type="file" id="file-input">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>

        <div class="members-sidebar">
            <div class="members-header">Active Members (<span id="memberCount">0</span>)</div>
            <div class="members-list" id="membersList"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let authState = 'login';
        let currentUser = null;
        let currentChannel = 'general-lounge';
        let socket = null;
        let selectedFile = null;
        let resetEmailTarget = '';
        let typingTimeout = null;

        const themes = [
            { primary: '#6366f1', secondary: '#a855f7' },
            { primary: '#3b82f6', secondary: '#06b6d4' },
            { primary: '#10b981', secondary: '#3b82f6' },
            { primary: '#f59e0b', secondary: '#ef4444' }
        ];
        let currentThemeIdx = 0;

        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const t = themes[currentThemeIdx];
            document.documentElement.style.setProperty('--primary', t.primary);
            document.documentElement.style.setProperty('--secondary', t.secondary);
        }

        const savedUser = localStorage.getItem('studycord_user');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
                launchApp();
            } catch (e) {
                localStorage.removeItem('studycord_user');
            }
        }

        function toggleNotifications() {
            if (!("Notification" in window)) return alert("Notifications not supported");
            Notification.requestPermission().then(perm => {
                if (perm === "granted") {
                    document.getElementById('notifBtn').classList.add('active');
                    document.getElementById('notifBtn').innerText = '🔔 Active';
                    new Notification("StudyCord Alerts Active!");
                }
            });
        }

        function toggleAuthMode() {
            document.getElementById('auth-error').innerText = '';
            document.getElementById('auth-success').innerText = '';

            if (authState === 'login') {
                authState = 'signup';
                document.getElementById('auth-title').innerText = 'Create Account';
                document.getElementById('auth-subtitle').innerText = 'Join the live community workspace';
                document.getElementById('reg-username').style.display = 'block';
                document.getElementById('forgot-password-trigger').style.display = 'none';
                document.getElementById('auth-btn').innerText = 'Sign Up';
                document.getElementById('switch-text').innerText = 'Already have an account? Log in';
            } else {
                authState = 'login';
                document.getElementById('auth-title').innerText = 'StudyCord';
                document.getElementById('auth-subtitle').innerText = 'Secure Live Student Workspace';
                document.getElementById('reg-username').style.display = 'none';
                document.getElementById('auth-password').style.display = 'block';
                document.getElementById('forgot-password-trigger').style.display = 'block';
                document.getElementById('auth-btn').innerText = 'Log In';
                document.getElementById('switch-text').innerText = "Don't have an account? Sign up";
            }
        }

        function showForgotPassword() {
            authState = 'forgot';
            document.getElementById('auth-title').innerText = 'Password Recovery';
            document.getElementById('auth-subtitle').innerText = 'Enter your email for the verification code';
            document.getElementById('reg-username').style.display = 'none';
            document.getElementById('auth-password').style.display = 'none';
            document.getElementById('forgot-password-trigger').style.display = 'none';
            document.getElementById('auth-btn').innerText = 'Send Verification Code';
            document.getElementById('switch-text').innerText = 'Back to Login';
            document.getElementById('auth-error').innerText = '';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const errorDiv = document.getElementById('auth-error');
            const successDiv = document.getElementById('auth-success');
            
            errorDiv.innerText = '';
            successDiv.innerText = '';

            if (authState === 'forgot') {
                if (!email) { errorDiv.innerText = 'Please enter your email address.'; return; }
                try {
                    const res = await fetch('/api/forgot-password', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (data.success) {
                        resetEmailTarget = email;
                        authState = 'reset';
                        document.getElementById('auth-title').innerText = 'Enter Security Code';
                        document.getElementById('auth-subtitle').innerText = 'Check your email for the 6-digit verification code.';
                        document.getElementById('auth-email').style.display = 'none';
                        document.getElementById('auth-password').style.display = 'block';
                        document.getElementById('auth-password').value = '';
                        document.getElementById('auth-password').placeholder = 'Enter 6-Digit Code';
                        
                        let np = document.getElementById('new-password');
                        if (!np) {
                            np = document.createElement('input');
                            np.type = 'password'; np.id = 'new-password'; np.placeholder = 'Enter New Password';
                            document.getElementById('form-fields').appendChild(np);
                        } else { np.style.display = 'block'; }
                        
                        document.getElementById('auth-btn').innerText = 'Update Password';
                        successDiv.innerText = data.message;
                    } else { errorDiv.innerText = data.error; }
                } catch (e) { errorDiv.innerText = 'Network connection failed.'; }
                return;
            }

            if (authState === 'reset') {
                const code = password;
                const newPassword = document.getElementById('new-password').value.trim();
                if (!code || !newPassword) { errorDiv.innerText = 'Please fill in all fields.'; return; }

                try {
                    const res = await fetch('/api/reset-password', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: resetEmailTarget, code, newPassword })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('Password successfully changed! Please log in with your new password.');
                        location.reload();
                    } else { errorDiv.innerText = data.error; }
                } catch (e) { errorDiv.innerText = 'Network connection failed.'; }
                return;
            }

            const endpoint = authState === 'login' ? '/api/login' : '/api/signup';
            const payload = authState === 'login' ? { email, password } : { username, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('studycord_user', JSON.stringify(currentUser));
                    launchApp();
                } else {
                    errorDiv.innerText = data.error || 'Authentication failed.';
                }
            } catch (err) {
                errorDiv.innerText = 'Network connection failed.';
            }
        }

        function logout() {
            localStorage.removeItem('studycord_user');
            location.reload();
        }

        function createNewChannel() {
            const name = prompt("Enter new channel name:");
            if (name && socket) socket.emit('create_channel', name.trim());
        }

        function launchApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('current-username-display').innerText = currentUser.username;

            socket = io();
            const chatForm = document.getElementById('chatForm');
            const messageInput = document.getElementById('message-input');
            const messagesBox = document.getElementById('messagesBox');
            const fileInput = document.getElementById('file-input');
            const channelList = document.getElementById('channelList');
            const typingIndicator = document.getElementById('typingIndicator');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    selectedFile = file;
                    messageInput.placeholder = `Attached: ${file.name}`;
                }
            });

            messageInput.addEventListener('input', () => {
                socket.emit('typing', { channel: currentChannel, username: currentUser.username });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('stop_typing', { channel: currentChannel });
                }, 1500);
            });

            socket.on('display_typing', (user) => {
                typingIndicator.style.display = 'flex';
                typingIndicator.innerText = `${user} is typing...`;
            });

            socket.on('hide_typing', () => {
                typingIndicator.style.display = 'none';
            });

            socket.on('load_channels', (channels) => {
                channelList.innerHTML = '';
                channels.forEach(ch => {
                    const div = document.createElement('div');
                    div.className = `channel ${ch === currentChannel ? 'active' : ''}`;
                    div.innerText = `# ${ch}`;
                    div.onclick = () => {
                        currentChannel = ch;
                        document.getElementById('current-channel-title').innerText = `# ${ch}`;
                        messageInput.placeholder = `Message #${ch}...`;
                        document.querySelectorAll('.channel').forEach(el => el.classList.toggle('active', el.innerText === `# ${ch}`));
                        socket.emit('join_channel', { channel: currentChannel, username: currentUser.username });
                    };
                    channelList.appendChild(div);
                });
            });

            socket.emit('join_channel', { channel: currentChannel, username: currentUser.username });

            socket.on('update_active_users', (users) => {
                const mList = document.getElementById('membersList');
                document.getElementById('memberCount').innerText = users.length;
                mList.innerHTML = '';
                users.forEach(u => {
                    mList.innerHTML += `<div class="member-item"><div class="status-dot"></div>${escapeHtml(u)}</div>`;
                });
            });

            socket.on('load_history', (messages) => {
                messagesBox.innerHTML = '';
                messages.forEach(msg => displayMessage(msg));
            });

            socket.on('chat_message', (msg) => {
                displayMessage(msg);
                if (msg.username !== currentUser.username && Notification.permission === "granted") {
                    new Notification(`New message from ${msg.username}`, { body: msg.text || "Sent attachment" });
                }
            });

            function displayMessage(msg) {
                const isMe = msg.username === currentUser.username;
                const row = document.createElement('div');
                row.className = `msg-row ${isMe ? 'me' : 'other'}`;
                
                let fileHtml = '';
                if (msg.file) {
                    if (msg.file.type.startsWith('image/')) {
                        fileHtml = `<img src="${msg.file.data}" alt="attachment">`;
                    } else {
                        fileHtml = `<a href="${msg.file.data}" download="${escapeHtml(msg.file.name)}">📁 Download ${escapeHtml(msg.file.name)}</a>`;
                    }
                }

                row.innerHTML = `
                    <div class="msg-bubble">
                        <div class="msg-user">${isMe ? '' : escapeHtml(msg.username)}</div>
                        <div class="msg-text">${escapeHtml(msg.text)}</div>
                        ${fileHtml}
                        <span class="msg-time">${escapeHtml(msg.timestamp || '')}</span>
                    </div>
                `;
                messagesBox.appendChild(row);
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = messageInput.value.trim();
                if (!text && !selectedFile) return;

                if (selectedFile) {
                    const reader = new FileReader();
                    reader.readAsDataURL(selectedFile);
                    reader.onload = () => {
                        emitMessage(text, { name: selectedFile.name, type: selectedFile.type, data: reader.result });
                    };
                } else {
                    emitMessage(text, null);
                }
            });

            function emitMessage(text, file) {
                socket.emit('chat_message', {
                    channel: currentChannel,
                    username: currentUser.username,
                    text,
                    file
                });
                socket.emit('stop_typing', { channel: currentChannel });
                messageInput.value = '';
                fileInput.value = '';
                selectedFile = null;
                messageInput.placeholder = `Type a message...`;
            }
        }
    </script>
</body>
</html>
