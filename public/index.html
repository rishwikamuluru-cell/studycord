<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyCord - Real-Time Collaboration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; }
        .sidebar-header { padding: 20px; font-size: 1.1rem; font-weight: bold; color: #ffffff; border-bottom: 2px solid #1f2023; }
        .channel-list { padding: 15px; }
        .channel { padding: 10px; border-radius: 4px; background-color: #404249; color: #ffffff; font-weight: 500; cursor: pointer; }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
        .chat-header { padding: 20px; background-color: #313338; border-bottom: 1px solid #1f2023; font-weight: bold; color: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { background-color: #2b2d31; padding: 10px 15px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .message .user { font-weight: bold; color: #5865f2; margin-bottom: 4px; font-size: 0.9rem; }
        .message .text { color: #dbdee1; font-size: 0.95rem; }

        /* Input Form */
        .input-form { padding: 20px; background-color: #313338; display: flex; gap: 10px; }
        input { background-color: #383a40; border: none; padding: 12px; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        #username-input { width: 150px; }
        #message-input { flex: 1; }
        button { background-color: #5865f2; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">StudyCord</div>
        <div class="channel-list">
            <div class="channel"># general-study</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header"># general-study</div>
        
        <div class="messages-box" id="messagesBox">
            <!-- Messages will append here -->
        </div>

        <form class="input-form" id="chatForm">
            <input type="text" id="username-input" placeholder="Your Name" required autocomplete="off">
            <input type="text" id="message-input" placeholder="Message #general-study..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('message-input');
        const usernameInput = document.getElementById('username-input');
        const messagesBox = document.getElementById('messagesBox');

        // Remember username in local storage so they don't have to retype it
        const savedUser = localStorage.getItem('studycord_username');
        if (savedUser) {
            usernameInput.value = savedUser;
        }

        usernameInput.addEventListener('input', (e) => {
            localStorage.setItem('studycord_username', e.target.value);
        });

        // Helper to display messages on screen
        function displayMessage(username, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `
                <div class="user">${escapeHtml(username)}</div>
                <div class="text">${escapeHtml(text)}</div>
            `;
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        // Security helper to prevent HTML injection
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load chat history when first connected
        socket.on('load_history', (messages) => {
            messagesBox.innerHTML = ''; // clear box
            messages.forEach((msg) => {
                displayMessage(msg.username, msg.text);
            });
        });

        // Listen for real-time messages
        socket.on('chat_message', (data) => {
            displayMessage(data.username, data.text);
        });

        // Send message on form submit
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            const username = usernameInput.value.trim();

            if (text && username) {
                socket.emit('chat_message', { username, text });
                messageInput.value = '';
            }
        });
    </script>
</body>
</html>
